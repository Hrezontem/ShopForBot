services:
  db:
    image: postgres:15
    container_name: shopforbot_db
    environment:
      POSTGRES_DB: shopforbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: back/Dockerfile
    container_name: shopforbot_django
    command: >
      sh -c "uv run python back/manage.py migrate &&
             uv run python back/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=shopforbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_password_here
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      db:
        condition: service_healthy

  # ⬇️ ДОБАВЛЯЕМ СЕРВИС БОТА
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: shopforbot_bot
    command: ["uv", "run", "python", "bot/bot.py"]
    volumes:
      - .:/app
    environment:
      - POSTGRES_DB=shopforbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_password_here
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/app/back    # ← Важно! Чтобы бот видел модуль 'core'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
